<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'" />
    <title>Stoper</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Stoper</h1>
      <p class="time" id="time" aria-live="polite">00:00:00.00</p>
      <p class="result" id="result" hidden></p>
      <div class="actions">
        <button type="button" id="start" class="btn btn-start">Start</button>
        <button type="button" id="stop" class="btn btn-stop" disabled>Stop</button>
        <button type="button" id="reset" class="btn btn-reset" disabled>Reset</button>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
